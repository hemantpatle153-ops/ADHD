name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  android:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Release signing: add these repository secrets to get a Play-ready
      # bundle. Without them the bundle is debug-signed (fine for testing,
      # rejected by Play). See docs/RELEASE.md.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/debug-info
          --dart-define=BREAKDOWN_API_URL=${{ vars.BREAKDOWN_API_URL }}
          --dart-define=BREAKDOWN_API_TOKEN=${{ secrets.BREAKDOWN_API_TOKEN }}
          --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
          --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}

      - name: Build test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --build-number=${{ github.run_number }}
          --dart-define=BREAKDOWN_API_URL=${{ vars.BREAKDOWN_API_URL }}
          --dart-define=BREAKDOWN_API_TOKEN=${{ secrets.BREAKDOWN_API_TOKEN }}
          --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
          --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}

      - uses: actions/upload-artifact@v4
        with:
          name: brightday-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/debug-info/
          if-no-files-found: error

      # One stable link to the newest tested APK from main:
      # https://github.com/<owner>/<repo>/releases/download/test-build/brightday.apk
      - name: Publish test APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk brightday.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build \
            --prerelease --title "Latest test build" \
            --notes "Newest APK built from main. For testing only; install from Google Play once the app is live."
          gh release upload test-build brightday.apk --clobber
          gh release edit test-build --notes "Newest APK built from main (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). For testing only."
